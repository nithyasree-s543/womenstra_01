<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B0F6B" />
      <stop offset="50%" stop-color="#8B1874" />
      <stop offset="100%" stop-color="#E0338B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4B0F6B" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#shadow)" />
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Woman Silhouette & Dynamic 'W' Lettermark -->
  <!-- Left Wing of W -->
  <path d="M120 180 C 135 240, 160 320, 195 340 C 215 350, 230 330, 245 280 L 260 230 L 285 300 C 300 340, 315 350, 335 340 C 370 320, 395 240, 410 180 C 412 172, 402 165, 392 170 C 365 210, 340 270, 325 270 C 315 270, 305 240, 295 210 L 275 160 C 270 148, 252 148, 247 160 L 225 210 C 215 240, 205 270, 195 270 C 180 270, 155 210, 128 170 C 118 165, 108 172, 120 180 Z" fill="#FFFFFF" />

  <!-- Graceful Woman Profile Halo / Face Silhouette Curve -->
  <path d="M 260 110 C 285 110, 305 130, 305 155 C 305 170, 295 185, 280 195 C 265 205, 255 215, 255 230" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  
  <!-- Sparkle Star Motif -->
  <g transform="translate(380, 100)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>

  <!-- Small secondary sparkle -->
  <g transform="translate(110, 120) scale(0.6)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="url(#goldGrad)" />
  </g>
</svg>
